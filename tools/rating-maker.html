<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>별점 메이커 - 체험단 매니저</title>
<link rel="icon" type="image/png" sizes="512x512" href="/images/favicon.png?v=20260803">
<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png?v=20260803">
<link rel="shortcut icon" href="/favicon.ico?v=20260803">
<link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png?v=20260803">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="블로그 리뷰에 넣기 좋은 별점 평가 카드를 쉽게 만들어보세요">
<link rel="stylesheet" href="/styles/base.css">
<!-- html2canvas: PNG 다운로드용 (Step 6) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<!-- 사용자 설정 디자인용 웹폰트 (필요할 때만 다운로드됨) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gaegu:wght@400;700&family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* ============================================
     rating-maker.html (별점 메이커)
     - 미니 헤더 + 히어로 + 좌우 2분할 (입력 + 미리보기)
     ============================================ */

  body {
    background: var(--bg);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ---- 미니 헤더 ---- */
  .tool-header {
    background: var(--paper);
    border-bottom: 1px solid var(--line);
    padding: 14px 0;
  }
  .tool-header-inner {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .tool-header-back {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    color: var(--ink-soft);
    text-decoration: none;
    font-size: 12px;
    font-weight: 600;
    transition: all 0.15s;
  }
  .tool-header-back:hover {
    border-color: var(--terra);
    color: var(--terra);
    transform: translateX(-2px);
  }
  .tool-header-logo {
    display: inline-block;
    line-height: 0;
    text-decoration: none;
  }
  .tool-header-logo img {
    height: 28px;
    width: auto;
    display: block;
  }
  @media (max-width: 600px) {
    .tool-header-logo img {
      height: 24px;
    }
  }

  /* ---- 히어로 영역 ---- */
  .tool-hero {
    max-width: 1100px;
    margin: 0 auto;
    padding: 48px 20px 32px;
    text-align: center;
  }
  .tool-hero-title {
    font-family: var(--font-serif);
    font-weight: 700;
    font-size: 36px;
    color: var(--ink);
    margin-bottom: 10px;
    letter-spacing: -0.01em;
  }
  .tool-hero-title .emoji {
    margin-right: 8px;
  }
  .tool-hero-desc {
    font-size: 15px;
    color: var(--ink-soft);
    line-height: 1.7;
    margin-bottom: 8px;
    word-break: keep-all;
  }
  .tool-hero-sub {
    font-size: 13px;
    color: var(--ink-faint);
    line-height: 1.7;
    margin-bottom: 24px;
    word-break: keep-all;
  }
  .tool-hero-cta {
    display: inline-block;
    padding: 12px 28px;
    background: var(--terra);
    color: white;
    border: none;
    border-radius: 24px;
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.18s ease;
    text-decoration: none;
  }
  .tool-hero-cta:hover {
    background: #A8431F;
    transform: translateY(-1px);
    box-shadow: 0 8px 20px rgba(194, 84, 43, 0.25);
  }

  /* ---- 메인 작업 영역 (좌우 분할) ---- */
  .tool-main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 20px 60px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 24px;
  }
  @media (max-width: 900px) {
    .tool-main {
      grid-template-columns: minmax(0, 1fr);
    }
  }
  .panel { min-width: 0; }

  /* 입력 패널 */
  .panel {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 24px;
  }
  .panel-title {
    font-family: var(--font-serif);
    font-weight: 700;
    font-size: 18px;
    color: var(--ink);
    margin-bottom: 18px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--line);
  }

  /* 입력 필드 그룹 */
  .field-group {
    margin-bottom: 18px;
  }
  .field-group-label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }
  .field-group input[type="text"],
  .field-group textarea {
    width: 100%;
    padding: 10px 12px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
    font-family: var(--font-body);
    font-size: 14px;
    color: var(--ink);
    box-sizing: border-box;
    transition: border-color 0.15s;
  }
  .field-group input[type="text"]:focus,
  .field-group textarea:focus {
    outline: none;
    border-color: var(--terra);
  }
  .field-group textarea {
    resize: vertical;
    min-height: 60px;
  }

  /* 카테고리 칩 (선택 버튼) */
  .category-chips {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .category-chip {
    padding: 7px 14px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    font-family: var(--font-body);
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-soft);
    cursor: pointer;
    transition: all 0.15s;
  }
  .category-chip:hover {
    border-color: var(--terra-soft);
    color: var(--terra);
  }
  .category-chip.active {
    background: var(--terra);
    color: white;
    border-color: var(--terra);
  }

  /* 평가 항목 행 (placeholder, Step 3에서 채움) */
  .rating-item-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px dashed var(--line);
  }
  .rating-item-name-input {
    flex: 1;
    padding: 6px 10px;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 6px;
    font-family: var(--font-body);
    font-size: 13px;
    color: var(--ink);
    transition: all 0.15s;
    min-width: 0;
  }
  .rating-item-name-input:hover {
    background: var(--card);
  }
  .rating-item-name-input:focus {
    outline: none;
    background: var(--card);
    border-color: var(--terra-soft);
  }
  .rating-item-stars-placeholder {
    color: var(--ink-faint);
    font-size: 14px;
    letter-spacing: 2px;
  }
  .rating-item-delete {
    width: 24px;
    height: 24px;
    border: none;
    background: transparent;
    color: var(--ink-faint);
    cursor: pointer;
    border-radius: 50%;
    font-size: 14px;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .rating-item-delete:hover {
    background: var(--rose);
    color: white;
  }
  .rating-item-delete:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }
  .rating-item-delete:disabled:hover {
    background: transparent;
    color: var(--ink-faint);
  }

  /* 항목 삭제 애니메이션 */
  .rating-item-row.removing {
    animation: itemFadeOut 0.22s ease forwards;
  }
  @keyframes itemFadeOut {
    to {
      opacity: 0;
      transform: translateX(20px);
      max-height: 0;
      padding-top: 0;
      padding-bottom: 0;
      margin: 0;
      border-bottom-color: transparent;
    }
  }
  /* 항목 추가 애니메이션 */
  .rating-item-row.adding {
    animation: itemFadeIn 0.22s ease;
  }
  @keyframes itemFadeIn {
    from {
      opacity: 0;
      transform: translateX(-12px);
    }
    to {
      opacity: 1;
      transform: translateX(0);
    }
  }

  /* ---- 별점 클릭 위젯 (입력 패널용, Step 3) ---- */
  .star-rating {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    user-select: none;
  }
  .star-cell {
    position: relative;
    width: 22px;
    height: 22px;
    cursor: pointer;
  }
  .star-cell svg {
    width: 100%;
    height: 100%;
    display: block;
  }
  .star-hit {
    position: absolute;
    top: 0;
    width: 50%;
    height: 100%;
    z-index: 2;
  }
  .star-hit.left { left: 0; }
  .star-hit.right { right: 0; }
  .star-cell:hover svg .star-base { fill: #FFE082; }
  .star-cell:active { transform: scale(0.92); }

  .star-score-text {
    margin-left: 8px;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-soft);
    min-width: 26px;
    text-align: right;
  }

  /* 항목 추가 버튼 */
  .btn-add-item {
    width: 100%;
    margin-top: 12px;
    padding: 10px;
    background: transparent;
    border: 1px dashed var(--line);
    border-radius: 8px;
    color: var(--ink-soft);
    font-family: var(--font-body);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-add-item:hover {
    border-color: var(--terra);
    color: var(--terra);
    background: rgba(194, 84, 43, 0.04);
  }
  .btn-add-item:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .btn-add-item:disabled:hover {
    border-color: var(--line);
    color: var(--ink-soft);
    background: transparent;
  }

  /* 항목 액션 행 (추가 + 초기화) */
  .items-actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }
  .items-actions .btn-add-item {
    margin-top: 0;
    flex: 1;
  }
  .btn-reset-items {
    padding: 10px 14px;
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--ink-soft);
    font-family: var(--font-body);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .btn-reset-items:hover {
    border-color: var(--mustard);
    color: #8B6F00;
    background: rgba(194, 157, 44, 0.06);
  }

  /* 항목 개수 표시 (작은 회색 텍스트) */
  .items-count {
    font-size: 11px;
    color: var(--ink-faint);
    font-weight: 500;
    margin-left: 6px;
  }

  /* 옵션 토글 (총점 표시, 워터마크 등) */
  .option-toggle {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 0;
  }
  .option-toggle-label {
    font-size: 13px;
    color: var(--ink);
  }
  .switch {
    position: relative;
    display: inline-block;
    width: 40px;
    height: 22px;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch-slider {
    position: absolute;
    inset: 0;
    background: var(--line);
    border-radius: 22px;
    cursor: pointer;
    transition: 0.2s;
  }
  .switch-slider::before {
    content: '';
    position: absolute;
    width: 16px;
    height: 16px;
    left: 3px;
    bottom: 3px;
    background: white;
    border-radius: 50%;
    transition: 0.2s;
  }
  .switch input:checked + .switch-slider {
    background: var(--terra);
  }
  .switch input:checked + .switch-slider::before {
    transform: translateX(18px);
  }

  /* ---- 우측 미리보기 ---- */
  .preview-panel {
    position: sticky;
    top: 20px;
    align-self: start;
  }
  @media (max-width: 900px) {
    .preview-panel { position: static; }
  }

  .preview-card-wrap {
    background: linear-gradient(135deg, #F5EEE3 0%, #E8DCC8 100%);
    border-radius: 16px;
    padding: 32px 20px;
    display: flex;
    align-items: flex-start;
    justify-content: flex-start;
    min-height: 360px;
    overflow: hidden;
    max-width: 100%;
  }
  /* 카드를 비율 그대로 축소하기 위한 스케일 래퍼.
     JS가 화면 폭에 맞춰 transform: scale()을 적용함. */
  .card-scaler {
    transform-origin: top left;
    transition: transform 0.15s ease;
    max-width: 100%;
  }

  /* 별점 카드 (실제 다운로드되는 부분) — 고정 크기 */
  .rating-card {
    background: white;
    border-radius: 14px;
    padding: 28px 24px;
    width: 340px;          /* 세로형 고정 폭 */
    box-shadow: 0 12px 32px rgba(42, 37, 34, 0.12);
    box-sizing: border-box;
  }
  /* 가로형: 넓은 고정 폭 + 항목 2열 그리드 (PC/모바일 동일) */
  .rating-card.ratio-landscape {
    width: 560px;          /* 가로형 고정 폭 */
  }
  .rating-card.ratio-landscape .rating-card-items {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0 24px;
  }
  /* 세로형은 기본값 (1열) — 별도 규칙 불필요 */
  .rating-card-title {
    font-family: var(--font-serif);
    font-weight: 700;
    font-size: 19px;
    color: var(--ink);
    margin-bottom: 6px;
    word-break: keep-all;
  }
  .rating-card-title.is-placeholder {
    color: var(--ink-faint);
    font-weight: 500;
    font-style: italic;
  }
  .rating-card-subtitle {
    font-size: 12px;
    color: var(--ink-soft);
    line-height: 1.6;
    margin-bottom: 18px;
    word-break: keep-all;
  }
  .rating-card-subtitle.is-placeholder {
    color: var(--ink-faint);
    font-style: italic;
  }
  .rating-card-items {
    margin-bottom: 18px;
  }
  .rating-card-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 0;
    font-size: 13px;
    color: var(--ink);
  }
  .rating-card-item-name {
    font-weight: 500;
  }
  .rating-card-item-stars {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .rating-card-item-stars-text {
    color: #E8B007;
    letter-spacing: 1px;
    font-size: 14px;
  }
  /* 미리보기 카드용 SVG 별 (작은 크기) */
  .preview-stars {
    display: inline-flex;
    align-items: center;
    gap: 1px;
  }
  .preview-stars svg {
    width: 14px;
    height: 14px;
    display: block;
  }
  .rating-card-item-score {
    color: var(--ink-soft);
    font-size: 12px;
    font-weight: 600;
    min-width: 26px;
    text-align: right;
  }
  .rating-card-total {
    border-top: 1px solid var(--line);
    padding-top: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .rating-card-total-label {
    font-family: var(--font-serif);
    font-weight: 700;
    font-size: 14px;
    color: var(--ink);
  }
  .rating-card-total-score {
    font-family: var(--font-serif);
    font-weight: 700;
    font-size: 22px;
    color: var(--terra);
  }
  .rating-card-total-score .max {
    font-size: 13px;
    color: var(--ink-faint);
    font-weight: 500;
  }
  .rating-card-watermark {
    margin-top: 16px;
    text-align: center;
    font-size: 10px;
    color: var(--ink-faint);
    letter-spacing: 0.5px;
    line-height: 1.5;
  }
  .rating-card-watermark .watermark-brand {
    font-weight: 500;
  }
  .rating-card-watermark .watermark-url {
    margin-top: 2px;
    font-family: ui-monospace, Menlo, monospace;
    font-size: 9px;
    opacity: 0.75;
    letter-spacing: 0;
  }

  /* ============================================
     템플릿 변형 (Step 5)
     기본 = minimal (위 .rating-card 그대로)
     beige, blog는 modifier 클래스로 덮어쓰기
     ============================================ */

  /* --- beige: 감성 베이지형 --- */
  .rating-card.tpl-beige {
    background: #FAF6EE;
    border: 1px solid #E8DCC8;
    border-radius: 20px;
    padding: 32px 26px;
    box-shadow: 0 16px 40px rgba(124, 96, 60, 0.15);
  }
  .rating-card.tpl-beige .rating-card-title {
    font-size: 21px;
    color: #4A3F33;
    text-align: center;
    margin-bottom: 8px;
  }
  .rating-card.tpl-beige .rating-card-subtitle {
    text-align: center;
    color: #7A6B5C;
    font-style: italic;
    margin-bottom: 22px;
    padding-bottom: 18px;
    border-bottom: 1px dashed #D8C8B0;
  }
  .rating-card.tpl-beige .rating-card-item {
    padding: 8px 0;
  }
  .rating-card.tpl-beige .rating-card-total {
    border-top: 1px dashed #D8C8B0;
    padding-top: 16px;
    margin-top: 4px;
  }
  .rating-card.tpl-beige .rating-card-total-score {
    color: #C2542B;
  }
  .rating-card.tpl-beige .rating-card-watermark {
    color: #B5A693;
  }

  /* --- blog: 블로그 본문형 --- */
  .rating-card.tpl-blog {
    background: white;
    border: none;
    border-left: 4px solid var(--terra);
    border-radius: 4px;
    padding: 22px 24px 22px 28px;
    box-shadow: 0 4px 12px rgba(42, 37, 34, 0.06);
    max-width: 360px;
  }
  .rating-card.tpl-blog .rating-card-title {
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 16px;
    color: var(--ink);
    margin-bottom: 4px;
    letter-spacing: -0.01em;
  }
  .rating-card.tpl-blog .rating-card-subtitle {
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 16px;
    padding: 0;
    border: none;
  }
  .rating-card.tpl-blog .rating-card-items {
    margin-bottom: 14px;
  }
  .rating-card.tpl-blog .rating-card-item {
    padding: 4px 0;
    font-size: 12px;
  }
  .rating-card.tpl-blog .rating-card-item-name {
    color: var(--ink-soft);
    font-weight: 500;
  }
  .rating-card.tpl-blog .rating-card-total {
    border-top: 1px solid var(--line);
    padding-top: 10px;
  }
  .rating-card.tpl-blog .rating-card-total-label {
    font-family: var(--font-body);
    font-size: 13px;
    color: var(--ink-soft);
  }
  .rating-card.tpl-blog .rating-card-total-score {
    font-family: var(--font-body);
    font-size: 18px;
  }
  .rating-card.tpl-blog .rating-card-watermark {
    margin-top: 12px;
    text-align: right;
    font-size: 9px;
  }

  /* --- 미리보기 배경도 템플릿에 따라 살짝 변화 --- */
  .preview-card-wrap.bg-minimal {
    background: linear-gradient(135deg, #F5F2EC 0%, #E8E2D6 100%);
  }
  .preview-card-wrap.bg-beige {
    background: linear-gradient(135deg, #F5EEE3 0%, #E8DCC8 100%);
  }
  .preview-card-wrap.bg-blog {
    background: linear-gradient(135deg, #F0EBE2 0%, #DDD4C2 100%);
  }

  /* --- custom: 사용자 설정형 (색·폰트·정렬을 CSS 변수로 주입) --- */
  .preview-card-wrap.bg-custom {
    background: linear-gradient(135deg, #ECE7DF 0%, #DBD4C8 100%);
  }
  .rating-card.tpl-custom {
    background: var(--c-card-bg, #FFFFFF);
    font-family: var(--c-font, var(--font-body));
    color: var(--c-ink, var(--ink));
    border: none;
    border-radius: 16px;
    padding: 28px 24px;
    box-shadow: 0 12px 32px rgba(42, 37, 34, 0.12);
  }
  .rating-card.tpl-custom .rating-card-title {
    color: var(--c-ink, var(--ink));
    font-family: inherit;
    text-align: var(--c-align, left);
  }
  .rating-card.tpl-custom .rating-card-subtitle {
    color: var(--c-ink-soft, var(--ink-soft));
    text-align: var(--c-align, left);
  }

<script>

    cafe:       ['음료', '디저트', '분위기', '좌석 편안함', '사진 만족도', '재방문 의사'],
    stay:       ['청결도', '위치', '침구', '시설', '뷰', '재방문 의사'],
    beauty:     ['상담 만족도', '관리 만족도', '위생', '시설', '친절도', '재방문 의사'],
    product:    ['디자인', '사용감', '가성비', '실용성', '만족도', '추천 의향'],
    custom:     ['항목 1', '항목 2', '항목 3']
  };

  // 항목 개수 제한
  const MIN_ITEMS = 1;   // 최소 1개 (그 이하면 삭제 비활성화)
  const MAX_ITEMS = 10;  // 최대 10개 (그 이상은 추가 비활성화)

  // ============== 사용자 설정(custom) 기본값 & 프리셋 ==============
  const DEFAULT_CUSTOM = {
    align: 'left',          // left | center | right
    cardColor: '#FFFFFF',   // 카드 배경색
    starColor: '#E8B007',   // 별(채워진) 색
    font: 'var(--font-body)' // 폰트 (기본 = 프리텐다드)
  };
  // 카드 색 빠른 선택용 프리셋
  const CARD_COLOR_PRESETS = ['#FFFFFF', '#FAF6EE', '#FFF4F4', '#F0F7F4', '#1E2A3A', '#2A2522'];
  // 별 색 빠른 선택용 프리셋
  const STAR_COLOR_PRESETS = ['#E8B007', '#C2542B', '#E5484D', '#E07A9B', '#3B7FC4', '#4A9D6E', '#2A2522'];

  // ============== 상태 ==============
  const state = {
    category: 'restaurant',
    template: 'minimal',  // minimal | beige | blog | custom
    ratio: 'landscape',   // landscape(가로형, 기본) | portrait(세로형)
    title: '',
    subtitle: '',
    // Step 3에서 별점 인터랙션 추가. 일단 기본 5.0
    items: CATEGORY_PRESETS.restaurant.map(name => ({ name, score: 5.0 })),
    showTotal: true,
    showWatermark: true,
    custom: Object.assign({}, DEFAULT_CUSTOM)
  };

  // 빈 값일 때 미리보기에 표시할 placeholder 문구
  const PLACEHOLDER_TITLE = '제목을 입력해주세요';
  const PLACEHOLDER_SUBTITLE = '한줄평을 입력해주세요';

  // ============== 별 SVG ==============
  // score (0~5, 0.5 단위)를 받아 5개 별 SVG HTML을 반환.
  // 각 별은 linearGradient의 offset으로 채워진 비율 결정.
  // full(1.0) / half(0.5) / empty(0)
  // size: 미리보기는 14px, 입력 패널은 22px
  const STAR_FILL = '#E8B007';
  const STAR_EMPTY = '#E5E0D8';
  const STAR_PATH = 'M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z';

  // 한 개의 별 SVG (고유한 gradient id 필요)
  function starSvg(fillRatio, idPrefix, fillColor) {
    // fillRatio: 0, 0.5, 1 / fillColor: 채워진 별 색 (없으면 기본 골드)
    const fill = fillColor || STAR_FILL;
    const gid = `g${idPrefix}_${Math.random().toString(36).slice(2, 8)}`;
    if (fillRatio === 1) {
      return `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path class="star-base" d="${STAR_PATH}" fill="${fill}"/>
      </svg>`;
    }
    if (fillRatio === 0) {
      return `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path class="star-base" d="${STAR_PATH}" fill="${STAR_EMPTY}"/>
      </svg>`;
    }
    // 반쪽 별 (왼쪽만 색칠)
    return `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="${gid}">
          <stop offset="50%" stop-color="${fill}"/>
          <stop offset="50%" stop-color="${STAR_EMPTY}"/>
        </linearGradient>
      </defs>
      <path class="star-base" d="${STAR_PATH}" fill="url(#${gid})"/>
    </svg>`;
  }

  // 5개 별 SVG 묶음 반환 (미리보기용)
  // score (0~5)를 0.5 단위로 처리
  // 채워진 별 색 (사용자 설정 모드면 사용자 색, 아니면 기본 골드)
  function activeStarFill() {
    return (state.template === 'custom' && state.custom && state.custom.starColor)
      ? state.custom.starColor
      : STAR_FILL;
  }

  function previewStarsHtml(score) {
    const fillColor = activeStarFill();
    const safe = Math.max(0, Math.min(5, score));
    let html = '<span class="preview-stars">';
    for (let i = 1; i <= 5; i++) {
      let fill;
      if (safe >= i) fill = 1;
      else if (safe >= i - 0.5) fill = 0.5;
      else fill = 0;
      html += starSvg(fill, 'p' + i, fillColor);
    }
    html += '</span>';
    return html;
  }

  // 입력 패널의 클릭 가능한 별점 위젯 HTML
  // 각 별을 좌/우 절반으로 나눠 클릭 hit 영역 둠
  function inputStarsHtml(itemIdx, score) {
    const safe = Math.max(0, Math.min(5, score));
    let html = '<div class="star-rating" data-idx="' + itemIdx + '">';
    for (let i = 1; i <= 5; i++) {
      let fill;
      if (safe >= i) fill = 1;
      else if (safe >= i - 0.5) fill = 0.5;
      else fill = 0;
      html += `
        <div class="star-cell" data-star="${i}">
          ${starSvg(fill, 'i' + itemIdx + '_' + i)}
          <div class="star-hit left" data-value="${i - 0.5}"></div>
          <div class="star-hit right" data-value="${i}"></div>
        </div>
      `;
    }
    html += `<span class="star-score-text">${formatScore(score)}</span>`;
    html += '</div>';
    return html;
  }

  function formatScore(score) {
    // 4.0 → "4.0", 4.5 → "4.5"
    return score.toFixed(1);
  }

  // ============== 평균 점수 계산 ==============
  function computeAverage(items) {
    if (!items || items.length === 0) return 0;
    const sum = items.reduce((acc, it) => acc + (it.score || 0), 0);
    return sum / items.length;
  }

  // 미리보기 카드에 템플릿 클래스 적용 (배경도 같이 전환)
  function applyTemplate() {
    const card = document.getElementById('previewCard');
    const wrap = card?.closest('.preview-card-wrap'); // 스케일 래퍼 건너뛰고 wrap 찾기
    if (!card) return;
    // 카드: tpl-{name} 클래스만 유지
    card.classList.remove('tpl-minimal', 'tpl-beige', 'tpl-blog', 'tpl-custom');
    card.classList.add('tpl-' + state.template);
    // 비율: ratio-{name}
    card.classList.remove('ratio-landscape', 'ratio-portrait');
    card.classList.add('ratio-' + state.ratio);
    // 배경: bg-{name}
    if (wrap) {
      wrap.classList.remove('bg-minimal', 'bg-beige', 'bg-blog', 'bg-custom');
      wrap.classList.add('bg-' + state.template);
    }
    // 사용자 설정 모드면 색·폰트·정렬 CSS 변수 주입 (아니면 제거)
    applyCustomVars(card);
    // 카드 크기가 바뀌었으니 스케일 다시 계산
    fitCardToWrap();
  }

  // ============== 사용자 설정(custom) 디자인 ==============
  const CUSTOM_KEY = 'rating-maker-custom-v1';
  const CUSTOM_VARS = [
    '--c-card-bg', '--c-font', '--c-ink', '--c-ink-soft',
    '--c-ink-faint', '--c-line', '--c-accent', '--c-align', '--c-total-justify'
  ];

  // #RGB / #RRGGBB → {r,g,b}
  function hexToRgb(hex) {
    let h = String(hex || '').replace('#', '').trim();
    if (h.length === 3) h = h.split('').map(c => c + c).join('');
    const n = parseInt(h, 16);
    if (isNaN(n)) return { r: 255, g: 255, b: 255 };
    return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
  }

  // 배경색 밝기에 따라 읽기 좋은 글자색(어두운/밝은) 자동 선택
  function readableInk(hex) {
    const { r, g, b } = hexToRgb(hex);
    const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
    return lum > 0.6 ? '#2A2522' : '#FFFFFF';
  }

  // 사용자 설정 모드일 때 카드에 CSS 변수 주입 (아니면 제거)
  function applyCustomVars(card) {
    if (!card) return;
    if (state.template !== 'custom') {
      CUSTOM_VARS.forEach(p => card.style.removeProperty(p));
      return;
    }
    const c = state.custom;
    const ink = readableInk(c.cardColor);
    const { r, g, b } = hexToRgb(ink);
    const rgba = a => `rgba(${r},${g},${b},${a})`;
    card.style.setProperty('--c-card-bg', c.cardColor);
    card.style.setProperty('--c-font', c.font);
    card.style.setProperty('--c-ink', ink);
    card.style.setProperty('--c-ink-soft', rgba(0.72));
    card.style.setProperty('--c-ink-faint', rgba(0.5));
    card.style.setProperty('--c-line', rgba(0.18));
    card.style.setProperty('--c-accent', c.starColor);
    card.style.setProperty('--c-align', c.align);
    card.style.setProperty('--c-total-justify',
      c.align === 'center' ? 'center' : c.align === 'right' ? 'flex-end' : 'space-between');
  }

  // 설정 컨트롤 패널 표시/숨김 (사용자 설정 템플릿일 때만 표시)
  function toggleCustomControls() {
    const el = document.getElementById('customControls');
    if (el) el.style.display = (state.template === 'custom') ? '' : 'none';
  }

  // localStorage 저장 / 불러오기
  function saveCustom() {
    try { localStorage.setItem(CUSTOM_KEY, JSON.stringify(state.custom)); } catch (e) {}
  }
  function loadCustom() {
    try {
      const raw = localStorage.getItem(CUSTOM_KEY);
      if (!raw) return;
      const saved = JSON.parse(raw);
      if (saved && typeof saved === 'object') {
        state.custom = Object.assign({}, DEFAULT_CUSTOM, saved);
      }
    } catch (e) {}
  }

  // 색상 스와치 버튼 렌더링
  function renderSwatches(containerId, colors, type) {
    const el = document.getElementById(containerId);
    if (!el) return;
    el.innerHTML = colors.map(col =>
      `<button type="button" class="color-swatch" data-color="${col}" data-type="${type}" style="background:${col}" title="${col}" aria-label="색상 ${col}"></button>`
    ).join('');
  }

  // 선택된 스와치에 active 표시 (대소문자 무시)
  function markActiveSwatch(containerId, color) {
    const el = document.getElementById(containerId);
    if (!el) return;
    const target = String(color || '').toLowerCase();
    el.querySelectorAll('.color-swatch').forEach(b => {
      b.classList.toggle('active', String(b.dataset.color || '').toLowerCase() === target);
    });
  }

  // 현재 state.custom 값을 컨트롤 UI에 반영
  function syncCustomControlsUI() {
    const c = state.custom;
    document.querySelectorAll('#alignChips .category-chip').forEach(ch => {
      ch.classList.toggle('active', ch.dataset.align === c.align);
    });
    const cc = document.getElementById('cardColorInput'); if (cc) cc.value = c.cardColor;
    const sc = document.getElementById('starColorInput'); if (sc) sc.value = c.starColor;
    markActiveSwatch('cardColorSwatches', c.cardColor);
    markActiveSwatch('starColorSwatches', c.starColor);
    const fs = document.getElementById('fontSelect'); if (fs) fs.value = c.font;
  }

  // ============== 이름 붙인 디자인 프리셋 (여러 개 저장) ==============
  const PRESETS_KEY = 'rating-maker-custom-presets-v1';
  const MAX_PRESETS = 12;
  let customPresets = [];

  function loadPresets() {
    try {
      const raw = localStorage.getItem(PRESETS_KEY);
      const arr = raw ? JSON.parse(raw) : [];
      customPresets = Array.isArray(arr) ? arr.filter(p => p && p.name) : [];
    } catch (e) { customPresets = []; }
  }
  function savePresets() {
    try { localStorage.setItem(PRESETS_KEY, JSON.stringify(customPresets)); } catch (e) {}
  }
  function makePresetId() {
    return 'p_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  }

  // 현재 설정을 이름 붙여 저장 (같은 이름이면 덮어쓰기)
  function saveCurrentAsPreset(name) {
    const nm = String(name || '').trim();
    if (!nm) return { ok: false, reason: 'empty' };
    const c = state.custom;
    const existing = customPresets.find(p => p.name === nm);
    if (existing) {
      existing.align = c.align;
      existing.cardColor = c.cardColor;
      existing.starColor = c.starColor;
      existing.font = c.font;
    } else {
      if (customPresets.length >= MAX_PRESETS) return { ok: false, reason: 'max' };
      customPresets.push({
        id: makePresetId(),
        name: nm,
        align: c.align, cardColor: c.cardColor, starColor: c.starColor, font: c.font
      });
    }
    savePresets();
    return { ok: true, overwrite: !!existing };
  }

  function deletePreset(id) {
    customPresets = customPresets.filter(p => p.id !== id);
    savePresets();
  }

  // 저장된 프리셋을 현재 설정으로 불러오기
  function loadPresetIntoCustom(id) {
    const p = customPresets.find(x => x.id === id);
    if (!p) return;
    state.custom = {
      align: p.align || DEFAULT_CUSTOM.align,
      cardColor: p.cardColor || DEFAULT_CUSTOM.cardColor,
      starColor: p.starColor || DEFAULT_CUSTOM.starColor,
      font: p.font || DEFAULT_CUSTOM.font
    };
    saveCustom(); // 작업 중인 설정(자동저장)도 같이 갱신
  }

  // 프리셋 칩 목록 렌더링
  function renderPresetChips() {
    const el = document.getElementById('presetChips');
    const empty = document.getElementById('presetEmpty');
    if (!el) return;
    if (!customPresets.length) {
      el.innerHTML = '';
      if (empty) empty.style.display = '';
      return;
    }
    if (empty) empty.style.display = 'none';
    el.innerHTML = customPresets.map(p => `
      <span class="preset-chip" data-id="${p.id}">
        <button type="button" class="preset-chip-load" data-id="${p.id}" title="${escapeAttr(p.name)} 불러오기">${escapeHtml(p.name)}</button>
        <button type="button" class="preset-chip-del" data-id="${p.id}" title="삭제" aria-label="${escapeAttr(p.name)} 삭제">✕</button>
      </span>
    `).join('');
  }

  // 카드를 미리보기 영역 폭에 맞게 비율 그대로 축소.
  // 카드는 고정 px(세로 340 / 가로 560)이고, 영역이 좁으면 scale로 줄임.
  // 영역이 충분히 넓으면 scale 1 (원본 크기, 확대는 안 함).
  function fitCardToWrap() {
    const card = document.getElementById('previewCard');
    const scaler = document.getElementById('cardScaler');
    const wrap = card?.closest('.preview-card-wrap');
    if (!card || !scaler || !wrap) return;
    requestAnimationFrame(() => {
      scaler.style.transform = 'scale(1)';
      scaler.style.height = '';
      const isLandscape = card.classList.contains('ratio-landscape');
      const baseWidth = isLandscape ? 560 : 340;
      const cardWidth = card.offsetWidth || baseWidth;
      const cardHeight = card.offsetHeight;
      // wrap 안쪽 실제 가용 폭 (getComputedStyle로 padding 정확히 빼기)
      const cs = getComputedStyle(wrap);
      const padL = parseFloat(cs.paddingLeft) || 0;
      const padR = parseFloat(cs.paddingRight) || 0;
      const avail = wrap.clientWidth - padL - padR - 2; // -2 안전 여유
      let scale = 1;
      if (avail > 0 && cardWidth > avail) {
        scale = avail / cardWidth;
      }
      scaler.style.transform = `scale(${scale})`;
      if (scale < 1 && cardHeight > 0) {
        scaler.style.height = Math.ceil(cardHeight * scale) + 'px';
        wrap.style.justifyContent = 'flex-start';
      } else {
        scaler.style.height = '';
        wrap.style.justifyContent = 'center';
      }
    });
  }

  // 미리보기의 제목/한줄평 텍스트 설정
  // 빈 값이면 placeholder 텍스트 + is-placeholder 클래스로 회색 이탤릭 처리
  function renderTitleAndSubtitle() {
    const titleEl = document.getElementById('previewTitle');
    const subEl = document.getElementById('previewSubtitle');
    if (titleEl) {
      if (state.title) {
        titleEl.textContent = state.title;
        titleEl.classList.remove('is-placeholder');
      } else {
        titleEl.textContent = PLACEHOLDER_TITLE;
        titleEl.classList.add('is-placeholder');
      }
    }
    if (subEl) {
      if (state.subtitle) {
        subEl.textContent = state.subtitle;
        subEl.classList.remove('is-placeholder');
        subEl.style.display = '';
      } else {
        subEl.textContent = PLACEHOLDER_SUBTITLE;
        subEl.classList.add('is-placeholder');
        subEl.style.display = '';
      }
    }
  }

  // ============== 렌더링 ==============
  // 미리보기 카드 전체를 state 기반으로 다시 그림
  function render() {
    applyTemplate();
    // 제목 / 한줄평 (빈 값이면 placeholder 표시)
    renderTitleAndSubtitle();

    // 평가 항목 목록
    const itemsEl = document.getElementById('previewItems');
    itemsEl.innerHTML = state.items.map(it => `
      <div class="rating-card-item">
        <span class="rating-card-item-name">${escapeHtml(it.name)}</span>
        <span class="rating-card-item-stars">
          ${previewStarsHtml(it.score)}
          <span class="rating-card-item-score">${formatScore(it.score)}</span>
        </span>
      </div>
    `).join('');

    // 총점
    const totalEl = document.getElementById('previewTotal');
    if (state.showTotal && state.items.length > 0) {
      const avg = computeAverage(state.items);
      totalEl.style.display = '';
      totalEl.innerHTML = `
        <span class="rating-card-total-label">총점</span>
        <span class="rating-card-total-score">${formatScore(avg)} <span class="max">/ 5.0</span></span>
      `;
    } else {
      totalEl.style.display = 'none';
    }

    // 워터마크
    const wmEl = document.getElementById('previewWatermark');
    wmEl.style.display = state.showWatermark ? '' : 'none';

    // 입력 패널의 평가 항목 리스트도 다시 그림 (Step 3~4에서 인터랙션 추가)
    renderInputItems();
  }

  // 입력 패널의 평가 항목 행들 렌더링
  function renderInputItems() {
    const list = document.getElementById('ratingItemsList');
    const canDelete = state.items.length > MIN_ITEMS;
    list.innerHTML = state.items.map((it, idx) => `
      <div class="rating-item-row" data-idx="${idx}">
        <input class="rating-item-name-input" type="text" value="${escapeAttr(it.name)}" data-idx="${idx}" placeholder="항목 이름">
        ${inputStarsHtml(idx, it.score)}
        <button class="rating-item-delete" title="삭제" data-idx="${idx}" ${canDelete ? '' : 'disabled'}>✕</button>
      </div>
    `).join('');

    // 항목 카운트 표시 (예: (4/10))
    const cntEl = document.getElementById('itemsCount');
    if (cntEl) cntEl.textContent = ` (${state.items.length}/${MAX_ITEMS})`;

    // 항목 추가 버튼 — 최대 도달 시 비활성화
    const btnAdd = document.getElementById('btnAddItem');
    if (btnAdd) {
      btnAdd.disabled = state.items.length >= MAX_ITEMS;
      btnAdd.textContent = btnAdd.disabled
        ? `+ 항목 추가 (최대 ${MAX_ITEMS}개)`
        : '+ 항목 추가';
    }

    // 항목 이름 수정 이벤트
    list.querySelectorAll('.rating-item-name-input').forEach(input => {
      input.addEventListener('input', (e) => {
        const idx = parseInt(e.target.dataset.idx);
        if (state.items[idx]) {
          state.items[idx].name = e.target.value;
          renderPreviewOnly();
        }
      });
    });

    // 별점 클릭 이벤트 (위임)
    list.querySelectorAll('.star-rating').forEach(widget => {
      const itemIdx = parseInt(widget.dataset.idx);
      widget.querySelectorAll('.star-hit').forEach(hit => {
        hit.addEventListener('click', () => {
          const newScore = parseFloat(hit.dataset.value);
          if (state.items[itemIdx]) {
            state.items[itemIdx].score = newScore;
            render();
          }
        });
      });
    });

    // 삭제 이벤트 — 부드러운 애니메이션 후 삭제
    list.querySelectorAll('.rating-item-delete').forEach(btn => {
      btn.addEventListener('click', (e) => {
        if (btn.disabled) return;
        const idx = parseInt(e.currentTarget.dataset.idx);
        const row = list.querySelector(`.rating-item-row[data-idx="${idx}"]`);
        if (row) {
          // 페이드아웃 애니메이션 (220ms) → state에서 제거 → 재렌더
          row.classList.add('removing');
          setTimeout(() => {
            state.items.splice(idx, 1);
            render();
          }, 220);
        } else {
          state.items.splice(idx, 1);
          render();
        }
      });
    });
  }

  // 미리보기만 갱신 (입력 패널 재렌더 안 함 → 포커스 유지)
  function renderPreviewOnly() {
    applyTemplate();
    renderTitleAndSubtitle();

    const itemsEl = document.getElementById('previewItems');
    itemsEl.innerHTML = state.items.map(it => `
      <div class="rating-card-item">
        <span class="rating-card-item-name">${escapeHtml(it.name)}</span>
        <span class="rating-card-item-stars">
          ${previewStarsHtml(it.score)}
          <span class="rating-card-item-score">${formatScore(it.score)}</span>
        </span>
      </div>
    `).join('');

    const totalEl = document.getElementById('previewTotal');
    if (state.showTotal && state.items.length > 0) {
      const avg = computeAverage(state.items);
      totalEl.style.display = '';
      totalEl.innerHTML = `
        <span class="rating-card-total-label">총점</span>
        <span class="rating-card-total-score">${formatScore(avg)} <span class="max">/ 5.0</span></span>
      `;
    } else {
      totalEl.style.display = 'none';
    }

    const wmEl = document.getElementById('previewWatermark');
    wmEl.style.display = state.showWatermark ? '' : 'none';
  }

  // ============== 유틸 ==============
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
    })[c]);
  }
  function escapeAttr(s) { return escapeHtml(s); }

  // ============== PNG 다운로드 ==============
  // 미리보기 카드를 html2canvas로 캡쳐 → PNG 다운로드
  async function downloadAsPng() {
    const btn = document.getElementById('btnDownload');
    if (!btn || btn.disabled) return;

    // 제목 비어있으면 안내 (placeholder가 그대로 캡쳐되면 안 좋음)
    if (!state.title.trim()) {
      alert('제목을 입력해주세요!');
      document.getElementById('inputTitle')?.focus();
      return;
    }

    // html2canvas 로드 확인
    if (typeof html2canvas === 'undefined') {
      alert('다운로드 라이브러리를 불러오지 못했어요. 새로고침 후 다시 시도해주세요.');
      return;
    }

    const card = document.getElementById('previewCard');
    if (!card) return;

    // 캡쳐 직전: 한줄평이 비어있으면 placeholder 텍스트를 잠시 숨기고 캡쳐
    const subEl = document.getElementById('previewSubtitle');
    const subIsPlaceholder = subEl && subEl.classList.contains('is-placeholder');
    let savedSubText = '';
    let savedSubDisplay = '';
    if (subIsPlaceholder) {
      savedSubText = subEl.textContent;
      savedSubDisplay = subEl.style.display;
      subEl.textContent = '';
      subEl.style.display = 'none';
    }

    // 버튼 비활성화 + 텍스트 변경
    const originalText = btn.textContent;
    btn.disabled = true;
    btn.textContent = '🎨 저장 중...';

    // 캡쳐 직전: 스케일 축소를 잠시 해제해 원본 크기(고해상도)로 캡쳐
    const scaler = document.getElementById('cardScaler');
    const savedTransform = scaler ? scaler.style.transform : '';
    if (scaler) scaler.style.transform = 'scale(1)';

    try {
      // 폰트가 모두 로드될 때까지 대기 (첫 캡쳐 시 한글 폰트 깨짐 방지)
      if (document.fonts && document.fonts.ready) {
        await document.fonts.ready;
      }

      const canvas = await html2canvas(card, {
        scale: 2,
        useCORS: true,
        backgroundColor: null,
        logging: false
      });

      // 파일명: 제목 기반 (특수문자 제거, 길이 제한)
      const safeTitle = (state.title || '별점카드')
        .trim()
        .replace(/[\\\/:*?"<>|]/g, '') // 파일명 금지문자 제거
        .slice(0, 30) || '별점카드';
      const filename = `${safeTitle}-별점카드.png`;

      // Canvas → Blob → 다운로드
      canvas.toBlob((blob) => {
        if (!blob) {
          throw new Error('Blob 생성 실패');
        }
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        // 메모리 정리
        setTimeout(() => URL.revokeObjectURL(url), 1000);

        // 성공 피드백
        btn.textContent = '✓ 저장됨!';
        setTimeout(() => {
          btn.textContent = originalText;
          btn.disabled = false;
        }, 1500);
      }, 'image/png');

    } catch (err) {
      console.error('[PNG 다운로드 실패]', err);
      alert('저장 중 오류가 발생했어요. 다시 시도해주세요.');
      btn.textContent = originalText;
      btn.disabled = false;
    } finally {
      // 숨겼던 placeholder 복원
      if (subIsPlaceholder && subEl) {
        subEl.textContent = savedSubText;
        subEl.style.display = savedSubDisplay;
      }
      // 스케일 복원
      if (scaler) {
        scaler.style.transform = savedTransform;
        fitCardToWrap();
      }
    }
  }

  // ============== 이벤트 ==============
  function init() {
    // 템플릿 카드 클릭
    document.querySelectorAll('.template-card').forEach(card => {
      card.addEventListener('click', () => {
        const tpl = card.dataset.template;
        if (!tpl) return;
        state.template = tpl;
        // 활성 카드 갱신
        document.querySelectorAll('.template-card').forEach(c => {
          c.classList.toggle('active', c.dataset.template === tpl);
        });
        toggleCustomControls();
        renderPreviewOnly();
      });
    });

    // 카테고리 칩 클릭 — 항목 자동 교체 (#categoryChips 안으로 스코프 한정)
    document.querySelectorAll('#categoryChips .category-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        const cat = chip.dataset.category;
        state.category = cat;
        // 활성 칩 표시 갱신
        document.querySelectorAll('#categoryChips .category-chip').forEach(c => {
          c.classList.toggle('active', c.dataset.category === cat);
        });
        // 항목 교체 — 모두 5.0 기본값
        state.items = CATEGORY_PRESETS[cat].map(name => ({ name, score: 5.0 }));
        render();
      });
    });

    // 카드 비율 칩 클릭 (#ratioChips)
    document.querySelectorAll('#ratioChips .category-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        const r = chip.dataset.ratio;
        if (!r) return;
        state.ratio = r;
        document.querySelectorAll('#ratioChips .category-chip').forEach(c => {
          c.classList.toggle('active', c.dataset.ratio === r);
        });
        renderPreviewOnly();
      });
    });

    // 제목 입력
    document.getElementById('inputTitle').addEventListener('input', (e) => {
      state.title = e.target.value;
      renderPreviewOnly();
    });

    // 한줄평 입력
    document.getElementById('inputSubtitle').addEventListener('input', (e) => {
      state.subtitle = e.target.value;
      renderPreviewOnly();
    });

    // 총점 표시 토글
    document.getElementById('optShowTotal').addEventListener('change', (e) => {
      state.showTotal = e.target.checked;
      renderPreviewOnly();
    });

    // 워터마크 표시 토글
    document.getElementById('optShowWatermark').addEventListener('change', (e) => {
      state.showWatermark = e.target.checked;
      renderPreviewOnly();
    });

    // 항목 추가 버튼
    document.getElementById('btnAddItem').addEventListener('click', () => {
      if (state.items.length >= MAX_ITEMS) return;
      state.items.push({ name: '', score: 5.0 });
      render();
      // 새로 추가된 행의 input에 포커스 + adding 애니메이션
      requestAnimationFrame(() => {
        const list = document.getElementById('ratingItemsList');
        const newRow = list.lastElementChild;
        if (newRow) {
          newRow.classList.add('adding');
          const input = newRow.querySelector('.rating-item-name-input');
          if (input) input.focus();
        }
      });
    });

    // 초기화 버튼 — 현재 카테고리의 기본 항목으로 되돌리기
    document.getElementById('btnResetItems').addEventListener('click', () => {
      const preset = CATEGORY_PRESETS[state.category] || CATEGORY_PRESETS.custom;
      state.items = preset.map(name => ({ name, score: 5.0 }));
      render();
    });

    // 다운로드 버튼
    document.getElementById('btnDownload').addEventListener('click', downloadAsPng);

    // ===== 사용자 설정(custom) 컨트롤 =====
    // 저장된 설정 불러오기 (있으면 state.custom에 반영)
    loadCustom();
    // 색상 스와치 버튼 그리기
    renderSwatches('cardColorSwatches', CARD_COLOR_PRESETS, 'card');
    renderSwatches('starColorSwatches', STAR_COLOR_PRESETS, 'star');

    // 글씨 정렬 칩
    document.querySelectorAll('#alignChips .category-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        const a = chip.dataset.align;
        if (!a) return;
        state.custom.align = a;
        document.querySelectorAll('#alignChips .category-chip').forEach(c => {
          c.classList.toggle('active', c.dataset.align === a);
        });
        saveCustom();
        renderPreviewOnly();
      });
    });

    // 색상 스와치 클릭 (카드색 / 별색 공통)
    document.querySelectorAll('.color-swatch').forEach(sw => {
      sw.addEventListener('click', () => {
        const col = sw.dataset.color;
        const type = sw.dataset.type;
        if (!col) return;
        if (type === 'card') {
          state.custom.cardColor = col;
          const inp = document.getElementById('cardColorInput'); if (inp) inp.value = col;
          markActiveSwatch('cardColorSwatches', col);
        } else {
          state.custom.starColor = col;
          const inp = document.getElementById('starColorInput'); if (inp) inp.value = col;
          markActiveSwatch('starColorSwatches', col);
        }
        saveCustom();
        renderPreviewOnly();
      });
    });

    // 카드색 직접 선택
    const cardColorInput = document.getElementById('cardColorInput');
    if (cardColorInput) {
      cardColorInput.addEventListener('input', (e) => {
        state.custom.cardColor = e.target.value;
        markActiveSwatch('cardColorSwatches', e.target.value);
        saveCustom();
        renderPreviewOnly();
      });
    }
    // 별색 직접 선택
    const starColorInput = document.getElementById('starColorInput');
    if (starColorInput) {
      starColorInput.addEventListener('input', (e) => {
        state.custom.starColor = e.target.value;
        markActiveSwatch('starColorSwatches', e.target.value);
        saveCustom();
        renderPreviewOnly();
      });
    }
    // 폰트 선택
    const fontSelect = document.getElementById('fontSelect');
    if (fontSelect) {
      fontSelect.addEventListener('change', (e) => {
        state.custom.font = e.target.value;
        saveCustom();
        renderPreviewOnly();
      });
    }

    // 불러온 값으로 컨트롤 UI 동기화 + 패널 표시 상태 반영
    syncCustomControlsUI();
    toggleCustomControls();

    // ===== 이름 붙인 디자인 프리셋 =====
    loadPresets();
    renderPresetChips();

    // 프리셋 칩 클릭 (불러오기 / 삭제) — 이벤트 위임
    const presetChipsEl = document.getElementById('presetChips');
    if (presetChipsEl) {
      presetChipsEl.addEventListener('click', (e) => {
        const loadBtn = e.target.closest('.preset-chip-load');
        const delBtn = e.target.closest('.preset-chip-del');
        if (loadBtn) {
          loadPresetIntoCustom(loadBtn.dataset.id);
          syncCustomControlsUI();
          renderPreviewOnly();
        } else if (delBtn) {
          const p = customPresets.find(x => x.id === delBtn.dataset.id);
          const nm = p ? p.name : '';
          if (confirm(`'${nm}' 디자인을 삭제할까요?`)) {
            deletePreset(delBtn.dataset.id);
            renderPresetChips();
          }
        }
      });
    }

    // 현재 설정 저장 버튼 + 이름 입력
    const savePresetBtn = document.getElementById('savePresetBtn');
    const presetNameInput = document.getElementById('presetNameInput');
    if (savePresetBtn && presetNameInput) {
      const doSavePreset = () => {
        const res = saveCurrentAsPreset(presetNameInput.value);
        if (!res.ok) {
          if (res.reason === 'empty') {
            alert('저장할 디자인 이름을 입력해주세요!');
            presetNameInput.focus();
          } else if (res.reason === 'max') {
            alert(`디자인은 최대 ${MAX_PRESETS}개까지 저장할 수 있어요. 기존 디자인을 삭제한 뒤 다시 시도해주세요.`);
          }
          return;
        }
        presetNameInput.value = '';
        renderPresetChips();
        const orig = savePresetBtn.textContent;
        savePresetBtn.textContent = res.overwrite ? '✓ 덮어썼어요' : '✓ 저장됨';
        savePresetBtn.disabled = true;
        setTimeout(() => {
          savePresetBtn.textContent = orig;
          savePresetBtn.disabled = false;
        }, 1400);
      };
      savePresetBtn.addEventListener('click', doSavePreset);
      presetNameInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); doSavePreset(); }
      });
    }

    // 최초 렌더
    render();

    // 창 크기 바뀌면 카드 스케일 다시 계산
    window.addEventListener('resize', fitCardToWrap);
    // 폰트 로드 후 폭이 바뀔 수 있으니 한 번 더
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(fitCardToWrap);
    }
  }

  // DOM 준비되면 시작
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
