<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>별점 메이커 - 체험단 매니저</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="블로그 리뷰에 넣기 좋은 별점 평가 카드를 쉽게 만들어보세요">
<link rel="stylesheet" href="/styles/base.css">
<style>
  /* ============================================
     rating-maker.html (별점 메이커)
     - 미니 헤더 + 히어로 + 좌우 2분할 (입력 + 미리보기)
     ============================================ */

  body {
    background: var(--bg);
    min-height: 100vh;
  }

  /* ---- 미니 헤더 ---- */
  .tool-header {
    background: var(--paper);
    border-bottom: 1px solid var(--line);
    padding: 14px 0;
  }
  .tool-header-inner {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .tool-header-back {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    color: var(--ink-soft);
    text-decoration: none;
    font-size: 12px;
    font-weight: 600;
    transition: all 0.15s;
  }
  .tool-header-back:hover {
    border-color: var(--terra);
    color: var(--terra);
    transform: translateX(-2px);
  }
  .tool-header-logo {
    font-family: var(--font-serif);
    font-weight: 700;
    font-size: 16px;
    color: var(--ink);
  }
  .tool-header-logo .mark {
    color: var(--terra);
    font-style: italic;
  }

  /* ---- 히어로 영역 ---- */
  .tool-hero {
    max-width: 1100px;
    margin: 0 auto;
    padding: 48px 20px 32px;
    text-align: center;
  }
  .tool-hero-title {
    font-family: var(--font-serif);
    font-weight: 700;
    font-size: 36px;
    color: var(--ink);
    margin-bottom: 10px;
    letter-spacing: -0.01em;
  }
  .tool-hero-title .emoji {
    margin-right: 8px;
  }
  .tool-hero-desc {
    font-size: 15px;
    color: var(--ink-soft);
    line-height: 1.7;
    margin-bottom: 8px;
    word-break: keep-all;
  }
  .tool-hero-sub {
    font-size: 13px;
    color: var(--ink-faint);
    line-height: 1.7;
    margin-bottom: 24px;
    word-break: keep-all;
  }
  .tool-hero-cta {
    display: inline-block;
    padding: 12px 28px;
    background: var(--terra);
    color: white;
    border: none;
    border-radius: 24px;
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.18s ease;
    text-decoration: none;
  }
  .tool-hero-cta:hover {
    background: #A8431F;
    transform: translateY(-1px);
    box-shadow: 0 8px 20px rgba(194, 84, 43, 0.25);
  }

  /* ---- 메인 작업 영역 (좌우 분할) ---- */
  .tool-main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 20px 60px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
  }
  @media (max-width: 900px) {
    .tool-main {
      grid-template-columns: 1fr;
    }
  }

  /* 입력 패널 */
  .panel {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 24px;
  }
  .panel-title {
    font-family: var(--font-serif);
    font-weight: 700;
    font-size: 18px;
    color: var(--ink);
    margin-bottom: 18px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--line);
  }

  /* 입력 필드 그룹 */
  .field-group {
    margin-bottom: 18px;
  }
  .field-group-label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }
  .field-group input[type="text"],
  .field-group textarea {
    width: 100%;
    padding: 10px 12px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
    font-family: var(--font-body);
    font-size: 14px;
    color: var(--ink);
    box-sizing: border-box;
    transition: border-color 0.15s;
  }
  .field-group input[type="text"]:focus,
  .field-group textarea:focus {
    outline: none;
    border-color: var(--terra);
  }
  .field-group textarea {
    resize: vertical;
    min-height: 60px;
  }

  /* 카테고리 칩 (선택 버튼) */
  .category-chips {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .category-chip {
    padding: 7px 14px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    font-family: var(--font-body);
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-soft);
    cursor: pointer;
    transition: all 0.15s;
  }
  .category-chip:hover {
    border-color: var(--terra-soft);
    color: var(--terra);
  }
  .category-chip.active {
    background: var(--terra);
    color: white;
    border-color: var(--terra);
  }

  /* 평가 항목 행 (placeholder, Step 3에서 채움) */
  .rating-item-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px dashed var(--line);
  }
  .rating-item-name-input {
    flex: 1;
    padding: 6px 10px;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 6px;
    font-family: var(--font-body);
    font-size: 13px;
    color: var(--ink);
    transition: all 0.15s;
    min-width: 0;
  }
  .rating-item-name-input:hover {
    background: var(--card);
  }
  .rating-item-name-input:focus {
    outline: none;
    background: var(--card);
    border-color: var(--terra-soft);
  }
  .rating-item-stars-placeholder {
    color: var(--ink-faint);
    font-size: 14px;
    letter-spacing: 2px;
  }
  .rating-item-delete {
    width: 24px;
    height: 24px;
    border: none;
    background: transparent;
    color: var(--ink-faint);
    cursor: pointer;
    border-radius: 50%;
    font-size: 14px;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .rating-item-delete:hover {
    background: var(--rose);
    color: white;
  }
  .rating-item-delete:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }
  .rating-item-delete:disabled:hover {
    background: transparent;
    color: var(--ink-faint);
  }

  /* 항목 삭제 애니메이션 */
  .rating-item-row.removing {
    animation: itemFadeOut 0.22s ease forwards;
  }
  @keyframes itemFadeOut {
    to {
      opacity: 0;
      transform: translateX(20px);
      max-height: 0;
      padding-top: 0;
      padding-bottom: 0;
      margin: 0;
      border-bottom-color: transparent;
    }
  }
  /* 항목 추가 애니메이션 */
  .rating-item-row.adding {
    animation: itemFadeIn 0.22s ease;
  }
  @keyframes itemFadeIn {
    from {
      opacity: 0;
      transform: translateX(-12px);
    }
    to {
      opacity: 1;
      transform: translateX(0);
    }
  }

  /* ---- 별점 클릭 위젯 (입력 패널용, Step 3) ---- */
  .star-rating {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    user-select: none;
  }
  .star-cell {
    position: relative;
    width: 22px;
    height: 22px;
    cursor: pointer;
  }
  .star-cell svg {
    width: 100%;
    height: 100%;
    display: block;
  }
  .star-hit {
    position: absolute;
    top: 0;
    width: 50%;
    height: 100%;
    z-index: 2;
  }
  .star-hit.left { left: 0; }
  .star-hit.right { right: 0; }
  .star-cell:hover svg .star-base { fill: #FFE082; }
  .star-cell:active { transform: scale(0.92); }

  .star-score-text {
    margin-left: 8px;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-soft);
    min-width: 26px;
    text-align: right;
  }

  /* 항목 추가 버튼 */
  .btn-add-item {
    width: 100%;
    margin-top: 12px;
    padding: 10px;
    background: transparent;
    border: 1px dashed var(--line);
    border-radius: 8px;
    color: var(--ink-soft);
    font-family: var(--font-body);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-add-item:hover {
    border-color: var(--terra);
    color: var(--terra);
    background: rgba(194, 84, 43, 0.04);
  }
  .btn-add-item:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .btn-add-item:disabled:hover {
    border-color: var(--line);
    color: var(--ink-soft);
    background: transparent;
  }

  /* 항목 액션 행 (추가 + 초기화) */
  .items-actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }
  .items-actions .btn-add-item {
    margin-top: 0;
    flex: 1;
  }
  .btn-reset-items {
    padding: 10px 14px;
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--ink-soft);
    font-family: var(--font-body);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .btn-reset-items:hover {
    border-color: var(--mustard);
    color: #8B6F00;
    background: rgba(194, 157, 44, 0.06);
  }

  /* 항목 개수 표시 (작은 회색 텍스트) */
  .items-count {
    font-size: 11px;
    color: var(--ink-faint);
    font-weight: 500;
    margin-left: 6px;
  }

  /* 옵션 토글 (총점 표시, 워터마크 등) */
  .option-toggle {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 0;
  }
  .option-toggle-label {
    font-size: 13px;
    color: var(--ink);
  }
  .switch {
    position: relative;
    display: inline-block;
    width: 40px;
    height: 22px;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch-slider {
    position: absolute;
    inset: 0;
    background: var(--line);
    border-radius: 22px;
    cursor: pointer;
    transition: 0.2s;
  }
  .switch-slider::before {
    content: '';
    position: absolute;
    width: 16px;
    height: 16px;
    left: 3px;
    bottom: 3px;
    background: white;
    border-radius: 50%;
    transition: 0.2s;
  }
  .switch input:checked + .switch-slider {
    background: var(--terra);
  }
  .switch input:checked + .switch-slider::before {
    transform: translateX(18px);
  }

  /* ---- 우측 미리보기 ---- */
  .preview-panel {
    position: sticky;
    top: 20px;
    align-self: start;
  }
  @media (max-width: 900px) {
    .preview-panel { position: static; }
  }

  .preview-card-wrap {
    background: linear-gradient(135deg, #F5EEE3 0%, #E8DCC8 100%);
    border-radius: 16px;
    padding: 32px 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 360px;
  }

  /* 별점 카드 (실제 다운로드되는 부분) */
  .rating-card {
    background: white;
    border-radius: 14px;
    padding: 28px 24px;
    width: 100%;
    max-width: 340px;
    box-shadow: 0 12px 32px rgba(42, 37, 34, 0.12);
  }
  .rating-card-title {
    font-family: var(--font-serif);
    font-weight: 700;
    font-size: 19px;
    color: var(--ink);
    margin-bottom: 6px;
    word-break: keep-all;
  }
  .rating-card-subtitle {
    font-size: 12px;
    color: var(--ink-soft);
    line-height: 1.6;
    margin-bottom: 18px;
    word-break: keep-all;
  }
  .rating-card-items {
    margin-bottom: 18px;
  }
  .rating-card-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 0;
    font-size: 13px;
    color: var(--ink);
  }
  .rating-card-item-name {
    font-weight: 500;
  }
  .rating-card-item-stars {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .rating-card-item-stars-text {
    color: #E8B007;
    letter-spacing: 1px;
    font-size: 14px;
  }
  /* 미리보기 카드용 SVG 별 (작은 크기) */
  .preview-stars {
    display: inline-flex;
    align-items: center;
    gap: 1px;
  }
  .preview-stars svg {
    width: 14px;
    height: 14px;
    display: block;
  }
  .rating-card-item-score {
    color: var(--ink-soft);
    font-size: 12px;
    font-weight: 600;
    min-width: 26px;
    text-align: right;
  }
  .rating-card-total {
    border-top: 1px solid var(--line);
    padding-top: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .rating-card-total-label {
    font-family: var(--font-serif);
    font-weight: 700;
    font-size: 14px;
    color: var(--ink);
  }
  .rating-card-total-score {
    font-family: var(--font-serif);
    font-weight: 700;
    font-size: 22px;
    color: var(--terra);
  }
  .rating-card-total-score .max {
    font-size: 13px;
    color: var(--ink-faint);
    font-weight: 500;
  }
  .rating-card-watermark {
    margin-top: 16px;
    text-align: center;
    font-size: 10px;
    color: var(--ink-faint);
    letter-spacing: 0.5px;
  }

  /* ============================================
     템플릿 변형 (Step 5)
     기본 = minimal (위 .rating-card 그대로)
     beige, blog는 modifier 클래스로 덮어쓰기
     ============================================ */

  /* --- beige: 감성 베이지형 --- */
  .rating-card.tpl-beige {
    background: #FAF6EE;
    border: 1px solid #E8DCC8;
    border-radius: 20px;
    padding: 32px 26px;
    box-shadow: 0 16px 40px rgba(124, 96, 60, 0.15);
  }
  .rating-card.tpl-beige .rating-card-title {
    font-size: 21px;
    color: #4A3F33;
    text-align: center;
    margin-bottom: 8px;
  }
  .rating-card.tpl-beige .rating-card-subtitle {
    text-align: center;
    color: #7A6B5C;
    font-style: italic;
    margin-bottom: 22px;
    padding-bottom: 18px;
    border-bottom: 1px dashed #D8C8B0;
  }
  .rating-card.tpl-beige .rating-card-item {
    padding: 8px 0;
  }
  .rating-card.tpl-beige .rating-card-total {
    border-top: 1px dashed #D8C8B0;
    padding-top: 16px;
    margin-top: 4px;
  }
  .rating-card.tpl-beige .rating-card-total-score {
    color: #C2542B;
  }
  .rating-card.tpl-beige .rating-card-watermark {
    color: #B5A693;
  }

  /* --- blog: 블로그 본문형 --- */
  .rating-card.tpl-blog {
    background: white;
    border: none;
    border-left: 4px solid var(--terra);
    border-radius: 4px;
    padding: 22px 24px 22px 28px;
    box-shadow: 0 4px 12px rgba(42, 37, 34, 0.06);
    max-width: 360px;
  }
  .rating-card.tpl-blog .rating-card-title {
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 16px;
    color: var(--ink);
    margin-bottom: 4px;
    letter-spacing: -0.01em;
  }
  .rating-card.tpl-blog .rating-card-subtitle {
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 16px;
    padding: 0;
    border: none;
  }
  .rating-card.tpl-blog .rating-card-items {
    margin-bottom: 14px;
  }
  .rating-card.tpl-blog .rating-card-item {
    padding: 4px 0;
    font-size: 12px;
  }
  .rating-card.tpl-blog .rating-card-item-name {
    color: var(--ink-soft);
    font-weight: 500;
  }
  .rating-card.tpl-blog .rating-card-total {
    border-top: 1px solid var(--line);
    padding-top: 10px;
  }
  .rating-card.tpl-blog .rating-card-total-label {
    font-family: var(--font-body);
    font-size: 13px;
    color: var(--ink-soft);
  }
  .rating-card.tpl-blog .rating-card-total-score {
    font-family: var(--font-body);
    font-size: 18px;
  }
  .rating-card.tpl-blog .rating-card-watermark {
    margin-top: 12px;
    text-align: right;
    font-size: 9px;
  }

  /* --- 미리보기 배경도 템플릿에 따라 살짝 변화 --- */
  .preview-card-wrap.bg-minimal {
    background: linear-gradient(135deg, #F5F2EC 0%, #E8E2D6 100%);
  }
  .preview-card-wrap.bg-beige {
    background: linear-gradient(135deg, #F5EEE3 0%, #E8DCC8 100%);
  }
  .preview-card-wrap.bg-blog {
    background: linear-gradient(135deg, #F0EBE2 0%, #DDD4C2 100%);
  }

  /* ============================================
     템플릿 선택 카드 (입력 패널)
     ============================================ */
  .template-cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .template-card {
    position: relative;
    padding: 14px 8px 10px;
    background: var(--card);
    border: 2px solid var(--line);
    border-radius: 10px;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
  }
  .template-card:hover {
    border-color: var(--terra-soft);
    transform: translateY(-1px);
  }
  .template-card.active {
    border-color: var(--terra);
    background: rgba(194, 84, 43, 0.04);
  }
  .template-card-preview {
    width: 100%;
    height: 60px;
    border-radius: 6px;
    margin-bottom: 8px;
    background-position: center;
    background-size: cover;
  }
  /* 각 템플릿 미리보기 썸네일 (CSS로 간단히) */
  .template-card[data-template="minimal"] .template-card-preview {
    background: white;
    border: 1px solid var(--line);
    position: relative;
  }
  .template-card[data-template="minimal"] .template-card-preview::before {
    content: '';
    position: absolute;
    top: 12px; left: 10px; right: 10px;
    height: 4px;
    background: var(--ink-faint);
    border-radius: 2px;
    opacity: 0.5;
  }
  .template-card[data-template="minimal"] .template-card-preview::after {
    content: '★★★★★';
    position: absolute;
    bottom: 10px; left: 10px;
    color: #E8B007;
    font-size: 9px;
    letter-spacing: 1px;
  }
  .template-card[data-template="beige"] .template-card-preview {
    background: #FAF6EE;
    border: 1px solid #E8DCC8;
    border-radius: 8px;
    position: relative;
  }
  .template-card[data-template="beige"] .template-card-preview::before {
    content: '';
    position: absolute;
    top: 14px; left: 16px; right: 16px;
    height: 3px;
    background: #C2A88A;
    border-radius: 2px;
  }
  .template-card[data-template="beige"] .template-card-preview::after {
    content: '★★★★★';
    position: absolute;
    bottom: 10px; left: 0; right: 0;
    text-align: center;
    color: #E8B007;
    font-size: 9px;
    letter-spacing: 1px;
  }
  .template-card[data-template="blog"] .template-card-preview {
    background: white;
    border: 1px solid var(--line);
    border-left: 3px solid var(--terra);
    border-radius: 3px;
    position: relative;
  }
  .template-card[data-template="blog"] .template-card-preview::before {
    content: '';
    position: absolute;
    top: 12px; left: 12px; right: 10px;
    height: 3px;
    background: var(--ink-soft);
    border-radius: 2px;
  }
  .template-card[data-template="blog"] .template-card-preview::after {
    content: '★★★★★';
    position: absolute;
    bottom: 10px; left: 12px;
    color: #E8B007;
    font-size: 9px;
    letter-spacing: 1px;
  }
  .template-card-name {
    font-size: 12px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 1px;
  }
  .template-card.active .template-card-name {
    color: var(--terra);
  }
  .template-card-desc {
    font-size: 10px;
    color: var(--ink-faint);
    line-height: 1.4;
  }

  /* 다운로드 버튼 */
  .download-actions {
    margin-top: 16px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .btn-download {
    flex: 1;
    padding: 12px 16px;
    background: var(--terra);
    color: white;
    border: none;
    border-radius: 10px;
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
    min-width: 140px;
  }
  .btn-download:hover {
    background: #A8431F;
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(194, 84, 43, 0.25);
  }

  /* 모바일 미세 조정 */
  @media (max-width: 600px) {
    .tool-hero { padding: 32px 16px 24px; }
    .tool-hero-title { font-size: 28px; }
    .tool-hero-desc { font-size: 14px; }
    .panel { padding: 20px; }
  }
</style>
</head>
<body>

<!-- ============== 미니 헤더 ============== -->
<header class="tool-header">
  <div class="tool-header-inner">
    <a href="/" class="tool-header-back">← 돌아가기</a>

<section class="tool-hero">
  <h1 class="tool-hero-title"><span class="emoji">⭐</span>별점 메이커</h1>
  <p class="tool-hero-desc">블로그 리뷰글에 넣기 좋은 별점 평가 카드를 쉽게 만들어보세요.</p>
  <p class="tool-hero-sub">맛집, 카페, 숙소, 뷰티 리뷰까지 항목별 만족도를 예쁘게 정리할 수 있어요.</p>
  <a href="#editor" class="tool-hero-cta">별점 카드 만들기</a>
</section>

<!-- ============== 메인 작업 영역 ============== -->
<main class="tool-main" id="editor">

  <!-- 좌측: 입력 패널 -->
  <div class="panel">
    <div class="panel-title">📝 정보 입력</div>

    <!-- 카테고리 선택 -->
    <div class="field-group">
      <label class="field-group-label">카테고리</label>
      <div class="category-chips" id="categoryChips">
        <button class="category-chip active" data-category="restaurant">🍴 맛집</button>
        <button class="category-chip" data-category="cafe">☕ 카페</button>
        <button class="category-chip" data-category="stay">🏨 숙소</button>
        <button class="category-chip" data-category="beauty">💆 뷰티/피부관리</button>
        <button class="category-chip" data-category="product">📦 제품</button>
        <button class="category-chip" data-category="custom">✏️ 자유 설정</button>
      </div>
    </div>

    <!-- 제목 -->
    <div class="field-group">
      <label class="field-group-label" for="inputTitle">제목</label>
      <input type="text" id="inputTitle" placeholder="예) 성수동 브런치 카페" value="성수동 브런치 카페">
    </div>

    <!-- 한줄평 -->
    <div class="field-group">
      <label class="field-group-label" for="inputSubtitle">한줄평</label>
      <textarea id="inputSubtitle" placeholder="예) 디저트와 분위기가 특히 만족스러웠어요">디저트와 분위기가 특히 만족스러웠어요</textarea>
    </div>

    <!-- 평가 항목 (Step 3에서 인터랙션 추가) -->
    <div class="field-group">
      <label class="field-group-label">평가 항목<span class="items-count" id="itemsCount"></span></label>
      <div id="ratingItemsList">
        <!-- JS render()에서 채움 -->
      </div>
      <div class="items-actions">
        <button class="btn-add-item" id="btnAddItem">+ 항목 추가</button>
        <button class="btn-reset-items" id="btnResetItems" title="카테고리 기본값으로 되돌리기">↺ 초기화</button>
      </div>
    </div>

    <!-- 디자인 템플릿 (Step 5) -->
    <div class="field-group">
      <label class="field-group-label">디자인 템플릿</label>
      <div class="template-cards" id="templateCards">
        <button class="template-card active" data-template="minimal">
          <div class="template-card-preview"></div>
          <div class="template-card-name">미니멀</div>
          <div class="template-card-desc">깔끔한 카드형</div>
        </button>
        <button class="template-card" data-template="beige">
          <div class="template-card-preview"></div>
          <div class="template-card-name">감성 베이지</div>
          <div class="template-card-desc">따뜻한 느낌</div>
        </button>
        <button class="template-card" data-template="blog">
          <div class="template-card-preview"></div>
          <div class="template-card-name">블로그</div>
          <div class="template-card-desc">본문 인용구형</div>
        </button>
      </div>
    </div>

    <!-- 옵션 -->
    <div class="field-group">
      <label class="field-group-label">옵션</label>
      <div class="option-toggle">
        <span class="option-toggle-label">총점 표시</span>
        <label class="switch">
          <input type="checkbox" id="optShowTotal" checked>
          <span class="switch-slider"></span>
        </label>
      </div>
      <div class="option-toggle">
        <span class="option-toggle-label">워터마크 표시</span>
        <label class="switch">
          <input type="checkbox" id="optShowWatermark" checked>
          <span class="switch-slider"></span>
        </label>
      </div>
    </div>
  </div>

  <!-- 우측: 미리보기 -->
  <div class="preview-panel">
    <div class="panel">
      <div class="panel-title">👀 미리보기</div>

      <div class="preview-card-wrap">
        <!-- 실제로 다운로드되는 카드 -->
        <div class="rating-card" id="previewCard">
          <div class="rating-card-title" id="previewTitle">성수동 브런치 카페</div>
          <div class="rating-card-subtitle" id="previewSubtitle">디저트와 분위기가 특히 만족스러웠어요</div>

          <div class="rating-card-items" id="previewItems">
            <!-- 더미 항목들 (Step 2에서 동적 생성) -->
            <div class="rating-card-item">
              <span class="rating-card-item-name">맛</span>
              <span class="rating-card-item-stars">
                <span class="rating-card-item-stars-text">★★★★★</span>
                <span class="rating-card-item-score">5.0</span>
              </span>
            </div>
            <div class="rating-card-item">
              <span class="rating-card-item-name">분위기</span>
              <span class="rating-card-item-stars">
                <span class="rating-card-item-stars-text">★★★★☆</span>
                <span class="rating-card-item-score">4.5</span>
              </span>
            </div>
          </div>

          <div class="rating-card-total" id="previewTotal">
            <span class="rating-card-total-label">총점</span>
            <span class="rating-card-total-score">4.8 <span class="max">/ 5.0</span></span>
          </div>

          <div class="rating-card-watermark" id="previewWatermark">made with 체험단 매니저</div>
        </div>
      </div>

      <div class="download-actions">
        <button class="btn-download" id="btnDownload">⬇ PNG로 저장하기</button>
      </div>
    </div>
  </div>

</main>

<script>
(function() {
  'use strict';

  // ============== 카테고리별 기본 평가 항목 ==============
  const CATEGORY_PRESETS = {
    restaurant: ['맛', '양', '가격', '분위기', '친절도', '재방문 의사'],
    cafe:       ['음료', '디저트', '분위기', '좌석 편안함', '사진 만족도', '재방문 의사'],
    stay:       ['청결도', '위치', '침구', '시설', '뷰', '재방문 의사'],
    beauty:     ['상담 만족도', '관리 만족도', '위생', '시설', '친절도', '재방문 의사'],
    product:    ['디자인', '사용감', '가성비', '실용성', '만족도', '추천 의향'],
    custom:     ['항목 1', '항목 2', '항목 3']
  };

  // 항목 개수 제한
  const MIN_ITEMS = 1;   // 최소 1개 (그 이하면 삭제 비활성화)
  const MAX_ITEMS = 10;  // 최대 10개 (그 이상은 추가 비활성화)

  // ============== 상태 ==============
  const state = {
    category: 'restaurant',
    template: 'minimal',  // minimal | beige | blog
    title: '성수동 브런치 카페',
    subtitle: '디저트와 분위기가 특히 만족스러웠어요',
    // Step 3에서 별점 인터랙션 추가. 일단 기본 5.0
    items: CATEGORY_PRESETS.restaurant.map(name => ({ name, score: 5.0 })),
    showTotal: true,
    showWatermark: true
  };

  // ============== 별 SVG ==============
  // score (0~5, 0.5 단위)를 받아 5개 별 SVG HTML을 반환.
  // 각 별은 linearGradient의 offset으로 채워진 비율 결정.
  // full(1.0) / half(0.5) / empty(0)
  // size: 미리보기는 14px, 입력 패널은 22px
  const STAR_FILL = '#E8B007';
  const STAR_EMPTY = '#E5E0D8';
  const STAR_PATH = 'M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z';

  // 한 개의 별 SVG (고유한 gradient id 필요)
  function starSvg(fillRatio, idPrefix) {
    // fillRatio: 0, 0.5, 1
    const gid = `g${idPrefix}_${Math.random().toString(36).slice(2, 8)}`;
    if (fillRatio === 1) {
      return `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path class="star-base" d="${STAR_PATH}" fill="${STAR_FILL}"/>
      </svg>`;
    }
    if (fillRatio === 0) {
      return `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path class="star-base" d="${STAR_PATH}" fill="${STAR_EMPTY}"/>
      </svg>`;
    }
    // 반쪽 별 (왼쪽만 색칠)
    return `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="${gid}">
          <stop offset="50%" stop-color="${STAR_FILL}"/>
          <stop offset="50%" stop-color="${STAR_EMPTY}"/>
        </linearGradient>
      </defs>
      <path class="star-base" d="${STAR_PATH}" fill="url(#${gid})"/>
    </svg>`;
  }

  // 5개 별 SVG 묶음 반환 (미리보기용)
  // score (0~5)를 0.5 단위로 처리
  function previewStarsHtml(score) {
    const safe = Math.max(0, Math.min(5, score));
    let html = '<span class="preview-stars">';
    for (let i = 1; i <= 5; i++) {
      let fill;
      if (safe >= i) fill = 1;
      else if (safe >= i - 0.5) fill = 0.5;
      else fill = 0;
      html += starSvg(fill, 'p' + i);
    }
    html += '</span>';
    return html;
  }

  // 입력 패널의 클릭 가능한 별점 위젯 HTML
  // 각 별을 좌/우 절반으로 나눠 클릭 hit 영역 둠
  function inputStarsHtml(itemIdx, score) {
    const safe = Math.max(0, Math.min(5, score));
    let html = '<div class="star-rating" data-idx="' + itemIdx + '">';
    for (let i = 1; i <= 5; i++) {
      let fill;
      if (safe >= i) fill = 1;
      else if (safe >= i - 0.5) fill = 0.5;
      else fill = 0;
      html += `
        <div class="star-cell" data-star="${i}">
          ${starSvg(fill, 'i' + itemIdx + '_' + i)}
          <div class="star-hit left" data-value="${i - 0.5}"></div>
          <div class="star-hit right" data-value="${i}"></div>
        </div>
      `;
    }
    html += `<span class="star-score-text">${formatScore(score)}</span>`;
    html += '</div>';
    return html;
  }

  function formatScore(score) {
    // 4.0 → "4.0", 4.5 → "4.5"
    return score.toFixed(1);
  }

  // ============== 평균 점수 계산 ==============
  function computeAverage(items) {
    if (!items || items.length === 0) return 0;
    const sum = items.reduce((acc, it) => acc + (it.score || 0), 0);
    return sum / items.length;
  }

  // 미리보기 카드에 템플릿 클래스 적용 (배경도 같이 전환)
  function applyTemplate() {
    const card = document.getElementById('previewCard');
    const wrap = card?.parentElement; // .preview-card-wrap
    if (!card) return;
    // 카드: tpl-{name} 클래스만 유지
    card.classList.remove('tpl-minimal', 'tpl-beige', 'tpl-blog');
    card.classList.add('tpl-' + state.template);
    // 배경: bg-{name}
    if (wrap) {
      wrap.classList.remove('bg-minimal', 'bg-beige', 'bg-blog');
      wrap.classList.add('bg-' + state.template);
    }
  }

  // ============== 렌더링 ==============
  // 미리보기 카드 전체를 state 기반으로 다시 그림
  function render() {
    applyTemplate();
    // 제목 / 한줄평
    document.getElementById('previewTitle').textContent = state.title || ' ';
    const subEl = document.getElementById('previewSubtitle');
    subEl.textContent = state.subtitle || '';
    subEl.style.display = state.subtitle ? '' : 'none';

    // 평가 항목 목록
    const itemsEl = document.getElementById('previewItems');
    itemsEl.innerHTML = state.items.map(it => `
      <div class="rating-card-item">
        <span class="rating-card-item-name">${escapeHtml(it.name)}</span>
        <span class="rating-card-item-stars">
          ${previewStarsHtml(it.score)}
          <span class="rating-card-item-score">${formatScore(it.score)}</span>
        </span>
      </div>
    `).join('');

    // 총점
    const totalEl = document.getElementById('previewTotal');
    if (state.showTotal && state.items.length > 0) {
      const avg = computeAverage(state.items);
      totalEl.style.display = '';
      totalEl.innerHTML = `
        <span class="rating-card-total-label">총점</span>
        <span class="rating-card-total-score">${formatScore(avg)} <span class="max">/ 5.0</span></span>
      `;
    } else {
      totalEl.style.display = 'none';
    }

    // 워터마크
    const wmEl = document.getElementById('previewWatermark');
    wmEl.style.display = state.showWatermark ? '' : 'none';

    // 입력 패널의 평가 항목 리스트도 다시 그림 (Step 3~4에서 인터랙션 추가)
    renderInputItems();
  }

  // 입력 패널의 평가 항목 행들 렌더링
  function renderInputItems() {
    const list = document.getElementById('ratingItemsList');
    const canDelete = state.items.length > MIN_ITEMS;
    list.innerHTML = state.items.map((it, idx) => `
      <div class="rating-item-row" data-idx="${idx}">
        <input class="rating-item-name-input" type="text" value="${escapeAttr(it.name)}" data-idx="${idx}" placeholder="항목 이름">
        ${inputStarsHtml(idx, it.score)}
        <button class="rating-item-delete" title="삭제" data-idx="${idx}" ${canDelete ? '' : 'disabled'}>✕</button>
      </div>
    `).join('');

    // 항목 카운트 표시 (예: (4/10))
    const cntEl = document.getElementById('itemsCount');
    if (cntEl) cntEl.textContent = ` (${state.items.length}/${MAX_ITEMS})`;

    // 항목 추가 버튼 — 최대 도달 시 비활성화
    const btnAdd = document.getElementById('btnAddItem');
    if (btnAdd) {
      btnAdd.disabled = state.items.length >= MAX_ITEMS;
      btnAdd.textContent = btnAdd.disabled
        ? `+ 항목 추가 (최대 ${MAX_ITEMS}개)`
        : '+ 항목 추가';
    }

    // 항목 이름 수정 이벤트
    list.querySelectorAll('.rating-item-name-input').forEach(input => {
      input.addEventListener('input', (e) => {
        const idx = parseInt(e.target.dataset.idx);
        if (state.items[idx]) {
          state.items[idx].name = e.target.value;
          renderPreviewOnly();
        }
      });
    });

    // 별점 클릭 이벤트 (위임)
    list.querySelectorAll('.star-rating').forEach(widget => {
      const itemIdx = parseInt(widget.dataset.idx);
      widget.querySelectorAll('.star-hit').forEach(hit => {
        hit.addEventListener('click', () => {
          const newScore = parseFloat(hit.dataset.value);
          if (state.items[itemIdx]) {
            state.items[itemIdx].score = newScore;
            render();
          }
        });
      });
    });

    // 삭제 이벤트 — 부드러운 애니메이션 후 삭제
    list.querySelectorAll('.rating-item-delete').forEach(btn => {
      btn.addEventListener('click', (e) => {
        if (btn.disabled) return;
        const idx = parseInt(e.currentTarget.dataset.idx);
        const row = list.querySelector(`.rating-item-row[data-idx="${idx}"]`);
        if (row) {
          // 페이드아웃 애니메이션 (220ms) → state에서 제거 → 재렌더
          row.classList.add('removing');
          setTimeout(() => {
            state.items.splice(idx, 1);
            render();
          }, 220);
        } else {
          state.items.splice(idx, 1);
          render();
        }
      });
    });
  }

  // 미리보기만 갱신 (입력 패널 재렌더 안 함 → 포커스 유지)
  function renderPreviewOnly() {
    applyTemplate();
    document.getElementById('previewTitle').textContent = state.title || ' ';
    const subEl = document.getElementById('previewSubtitle');
    subEl.textContent = state.subtitle || '';
    subEl.style.display = state.subtitle ? '' : 'none';

    const itemsEl = document.getElementById('previewItems');
    itemsEl.innerHTML = state.items.map(it => `
      <div class="rating-card-item">
        <span class="rating-card-item-name">${escapeHtml(it.name)}</span>
        <span class="rating-card-item-stars">
          ${previewStarsHtml(it.score)}
          <span class="rating-card-item-score">${formatScore(it.score)}</span>
        </span>
      </div>
    `).join('');

    const totalEl = document.getElementById('previewTotal');
    if (state.showTotal && state.items.length > 0) {
      const avg = computeAverage(state.items);
      totalEl.style.display = '';
      totalEl.innerHTML = `
        <span class="rating-card-total-label">총점</span>
        <span class="rating-card-total-score">${formatScore(avg)} <span class="max">/ 5.0</span></span>
      `;
    } else {
      totalEl.style.display = 'none';
    }

    const wmEl = document.getElementById('previewWatermark');
    wmEl.style.display = state.showWatermark ? '' : 'none';
  }

  // ============== 유틸 ==============
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
    })[c]);
  }
  function escapeAttr(s) { return escapeHtml(s); }

  // ============== 이벤트 ==============
  function init() {
    // 템플릿 카드 클릭
    document.querySelectorAll('.template-card').forEach(card => {
      card.addEventListener('click', () => {
        const tpl = card.dataset.template;
        if (!tpl) return;
        state.template = tpl;
        // 활성 카드 갱신
        document.querySelectorAll('.template-card').forEach(c => {
          c.classList.toggle('active', c.dataset.template === tpl);
        });
        renderPreviewOnly();
      });
    });

    // 카테고리 칩 클릭 — 항목 자동 교체
    document.querySelectorAll('.category-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        const cat = chip.dataset.category;
        state.category = cat;
        // 활성 칩 표시 갱신
        document.querySelectorAll('.category-chip').forEach(c => {
          c.classList.toggle('active', c.dataset.category === cat);
        });
        // 항목 교체 — 모두 5.0 기본값
        state.items = CATEGORY_PRESETS[cat].map(name => ({ name, score: 5.0 }));
        render();
      });
    });

    // 제목 입력
    document.getElementById('inputTitle').addEventListener('input', (e) => {
      state.title = e.target.value;
      renderPreviewOnly();
    });

    // 한줄평 입력
    document.getElementById('inputSubtitle').addEventListener('input', (e) => {
      state.subtitle = e.target.value;
      renderPreviewOnly();
    });

    // 총점 표시 토글
    document.getElementById('optShowTotal').addEventListener('change', (e) => {
      state.showTotal = e.target.checked;
      renderPreviewOnly();
    });

    // 워터마크 표시 토글
    document.getElementById('optShowWatermark').addEventListener('change', (e) => {
      state.showWatermark = e.target.checked;
      renderPreviewOnly();
    });

    // 항목 추가 버튼
    document.getElementById('btnAddItem').addEventListener('click', () => {
      if (state.items.length >= MAX_ITEMS) return;
      state.items.push({ name: '', score: 5.0 });
      render();
      // 새로 추가된 행의 input에 포커스 + adding 애니메이션
      requestAnimationFrame(() => {
        const list = document.getElementById('ratingItemsList');
        const newRow = list.lastElementChild;
        if (newRow) {
          newRow.classList.add('adding');
          const input = newRow.querySelector('.rating-item-name-input');
          if (input) input.focus();
        }
      });
    });

    // 초기화 버튼 — 현재 카테고리의 기본 항목으로 되돌리기
    document.getElementById('btnResetItems').addEventListener('click', () => {
      const preset = CATEGORY_PRESETS[state.category] || CATEGORY_PRESETS.custom;
      state.items = preset.map(name => ({ name, score: 5.0 }));
      render();
    });

    // 최초 렌더
    render();
  }

  // DOM 준비되면 시작
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>

</body>
</html>
